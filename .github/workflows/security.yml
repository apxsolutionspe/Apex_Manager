name: Auditoría semanal de dependencias
on:
  schedule:
    - cron: '13 12 * * 1' # Lunes 07:13 hora de Lima, salvo ajustes de GitHub
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths: [requirements.txt, .github/workflows/security.yml]
  pull_request:
    paths: [requirements.txt, .github/workflows/security.yml]
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit utility
        run: python -m pip install pip-audit
      - name: Scan Python dependencies
        run: python -m pip_audit --requirement requirements.txt --disable-pip
