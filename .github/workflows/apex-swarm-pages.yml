name: APEX Swarm · QA, vista previa y publicación

on:
  push:
    branches: [main]
    paths:
      - 'apex-global-intelligence-swarm/**'
      - '.github/workflows/apex-swarm-pages.yml'
  pull_request:
    paths:
      - 'apex-global-intelligence-swarm/**'
      - '.github/workflows/apex-swarm-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *" # Public read-only refresh; UTC (may be delayed by GitHub)

permissions:
  contents: read

concurrency:
  group: apex-swarm-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Pruebas y vista previa descargable
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis y pruebas
        working-directory: apex-global-intelligence-swarm
        run: |
          node --check app.js
          node --check core.js
          npm test
      - name: Empaquetar actualización local verificable
        run: |
          python3 -m py_compile apex-global-intelligence-swarm/local-updates/updater.py
          python3 -m py_compile apex-global-intelligence-swarm/local-updates/build-release.py
          python3 apex-global-intelligence-swarm/local-updates/build-release.py
          test -s apex-global-intelligence-swarm/local-updates/update.json
          test -s apex-global-intelligence-swarm/local-updates/APEX_Swarm_patch_v0.3.0.zip
      - name: Empaquetar solo frontend público
        run: |
          mkdir -p site
          cp apex-global-intelligence-swarm/index.html site/
          cp apex-global-intelligence-swarm/app.js site/
          cp apex-global-intelligence-swarm/core.js site/
          cp apex-global-intelligence-swarm/style.css site/
          test -s site/index.html
          test -s site/app.js
          test -s site/core.js
          test -s site/style.css
      - name: Conservar vista previa durante 7 días
        uses: actions/upload-artifact@v4
        with:
          name: apex-swarm-preview
          path: site/
          if-no-files-found: error
          retention-days: 7

  verify-and-deploy:
    name: Desplegar únicamente desde main
    needs: preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis y pruebas
        working-directory: apex-global-intelligence-swarm
        run: |
          node --check app.js
          node --check core.js
          npm test
      - name: Empaquetar actualización local verificable
        run: |
          python3 -m py_compile apex-global-intelligence-swarm/local-updates/updater.py
          python3 -m py_compile apex-global-intelligence-swarm/local-updates/build-release.py
          python3 apex-global-intelligence-swarm/local-updates/build-release.py
          test -s apex-global-intelligence-swarm/local-updates/update.json
          test -s apex-global-intelligence-swarm/local-updates/APEX_Swarm_patch_v0.3.0.zip
      - name: Actualizar radar público en segundo plano
        run: node apex-global-intelligence-swarm/scripts/refresh-feed.mjs
      - name: Clasificar señales públicas sin ejecutar reclamaciones
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node apex-global-intelligence-swarm/scripts/prioritize-feed.mjs
          test -s apex-global-intelligence-swarm/feed/prioritized.json
      - name: Conservar historial público de oportunidades en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex-global-intelligence-swarm/feed/archive.json apex-global-intelligence-swarm/feed/prioritized.json
          if git diff --cached --quiet; then
            echo "El archivo histórico no cambió."
          else
            git commit -m "data(swarm): actualizar archivo público de señales [skip ci]"
            if git push origin HEAD:main; then
              echo "Archivo actualizado correctamente."
            else
              echo "::warning::GitHub cambió durante el escaneo. Recuperando sobre la última versión."
              for attempt in 1 2 3; do
                git fetch origin main
                git reset --hard origin/main
                node apex-global-intelligence-swarm/scripts/refresh-feed.mjs
                node apex-global-intelligence-swarm/scripts/prioritize-feed.mjs
                git add apex-global-intelligence-swarm/feed/archive.json apex-global-intelligence-swarm/feed/prioritized.json
                if git diff --cached --quiet; then
                  echo "Historial ya está actualizado."
                  break
                fi
                git commit -m "data(swarm): actualizar archivo público de señales [skip ci]"
                if git push origin HEAD:main; then
                  echo "Archivo actualizado en intento $attempt."
                  break
                fi
                echo "::warning::Conflicto concurrente en el intento $attempt."
              done
            fi
          fi
      - name: Preparar GitHub Pages (habilitado por propietario)
        uses: actions/configure-pages@v5
      - name: Subir únicamente el sitio de APEX Swarm
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apex-global-intelligence-swarm
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
