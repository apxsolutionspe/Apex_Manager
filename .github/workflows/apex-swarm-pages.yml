name: APEX Swarm · QA, vista previa y publicación

on:
  push:
    branches: [main]
    paths:
      - 'apex-global-intelligence-swarm/**'
      - '.github/workflows/apex-swarm-pages.yml'
  pull_request:
    paths:
      - 'apex-global-intelligence-swarm/**'
      - '.github/workflows/apex-swarm-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-swarm-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Pruebas y vista previa descargable
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis y pruebas
        working-directory: apex-global-intelligence-swarm
        run: |
          node --check app.js
          node --check core.js
          npm test
      - name: Empaquetar solo frontend público
        run: |
          mkdir -p site
          cp apex-global-intelligence-swarm/index.html site/
          cp apex-global-intelligence-swarm/app.js site/
          cp apex-global-intelligence-swarm/core.js site/
          cp apex-global-intelligence-swarm/style.css site/
          test -s site/index.html
          test -s site/app.js
          test -s site/core.js
          test -s site/style.css
      - name: Conservar vista previa durante 7 días
        uses: actions/upload-artifact@v4
        with:
          name: apex-swarm-preview
          path: site/
          if-no-files-found: error
          retention-days: 7

  verify-and-deploy:
    name: Desplegar únicamente desde main
    needs: preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis y pruebas
        working-directory: apex-global-intelligence-swarm
        run: |
          node --check app.js
          node --check core.js
          npm test
      - name: Preparar GitHub Pages (habilitado por propietario)
        uses: actions/configure-pages@v5
      - name: Subir únicamente el sitio de APEX Swarm
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apex-global-intelligence-swarm
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
