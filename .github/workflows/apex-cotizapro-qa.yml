name: CotizaPro · pruebas producto digital

on:
  pull_request:
    paths:
      - 'apex-global-intelligence-swarm/productos/cotizapro/**'
      - 'apex-global-intelligence-swarm/tests/cotizapro*'
      - '.github/workflows/apex-cotizapro-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apex-global-intelligence-swarm/productos/cotizapro/**'
      - 'apex-global-intelligence-swarm/tests/cotizapro*'
      - '.github/workflows/apex-cotizapro-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-product:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar módulos y cálculos
        working-directory: apex-global-intelligence-swarm
        run: |
          node --check productos/cotizapro/core.mjs
          node --check productos/cotizapro/app.mjs
          node --test tests/cotizapro.test.mjs
      - name: Preparar Chromium
        working-directory: apex-global-intelligence-swarm
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Servir cotizador de forma local
        run: |
          python3 -m http.server 4173 --directory apex-global-intelligence-swarm >/tmp/cotizapro.log 2>&1 &
          sleep 2
      - name: Validar la demo funcional en móvil
        working-directory: apex-global-intelligence-swarm
        run: node tests/cotizapro-browser.mjs
      - name: Evidencia de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotizapro-qa-${{ github.run_id }}
          path: apex-global-intelligence-swarm/apex-cotizapro-qa.png
          if-no-files-found: ignore
          retention-days: 14
