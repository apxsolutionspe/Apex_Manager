name: APEX Crypto · vigilancia horaria sin custodia

on:
  schedule:
    - cron: '23 * * * *' # 24 h/día, frecuencia nominal 1 hora (GitHub puede retrasar)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apex-crypto-hourly.yml'
      - 'apex-global-intelligence-swarm/scripts/crypto-*.mjs'
      - 'apex-global-intelligence-swarm/scripts/apex-handoff.mjs'
      - 'apex-global-intelligence-swarm/tests/apex-handoff.test.mjs'
      - 'apex-global-intelligence-swarm/tests/crypto*.test.mjs'
      - 'apex-global-intelligence-swarm/native/**'
      - 'apex-global-intelligence-swarm/scripts/private-wallet-observer.mjs'
      - 'apex-global-intelligence-swarm/scripts/erc20-watch.mjs'
      - 'apex-global-intelligence-swarm/tests/erc20-watch.test.mjs'
      - 'apex-global-intelligence-swarm/tests/private-wallet-observer.test.mjs'
      - 'apex-global-intelligence-swarm/scripts/wallet-audit.mjs'
      - 'apex-global-intelligence-swarm/tests/wallet-audit.test.mjs'

permissions:
  contents: write

concurrency:
  group: apex-crypto-hourly
  cancel-in-progress: false

jobs:
  public-crypto-research:
    name: Revisar recompensas oficiales, comprobar pruebas y conservar historial
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Código del propietario
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js estable
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis y pruebas del radar cripto
        working-directory: apex-global-intelligence-swarm
        run: |
          node --check scripts/crypto-core.mjs
          node --check scripts/crypto-history.mjs
          node --check scripts/crypto-watch.mjs
          node --check scripts/crypto-discovery.mjs
          node --check scripts/crypto-direct-leads.mjs
          node --check scripts/crypto-health.mjs
          node --check scripts/apex-handoff.mjs
          node --test tests/crypto.test.mjs tests/crypto-history.test.mjs tests/crypto-discovery.test.mjs tests/crypto-direct-leads.test.mjs tests/crypto-health.test.mjs tests/apex-handoff.test.mjs
      - name: Compilar y probar clasificador nativo Rust sin dependencias externas
        run: |
          rustc --version
          rustc --edition=2021 --test apex-global-intelligence-swarm/native/crypto_classifier.rs -o "$RUNNER_TEMP/apex-native-test"
          "$RUNNER_TEMP/apex-native-test"
          rustc --edition=2021 -O apex-global-intelligence-swarm/native/crypto_classifier.rs -o "$RUNNER_TEMP/apex-native-screen"
      - name: Investigación cripto solo lectura y guardado con reintentos
        env:
          APEX_CRYPTO_NATIVE_CLASSIFIER: ${{ runner.temp }}/apex-native-screen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node apex-global-intelligence-swarm/scripts/crypto-watch.mjs
            node apex-global-intelligence-swarm/scripts/crypto-discovery.mjs
            node apex-global-intelligence-swarm/scripts/crypto-direct-leads.mjs
            node apex-global-intelligence-swarm/scripts/crypto-health.mjs
            node apex-global-intelligence-swarm/scripts/apex-handoff.mjs
            node -e "const f=require('./apex-global-intelligence-swarm/feed/crypto.json');if(f.economics.verified_income_usd!==0||f.opportunities.some(x=>x.automatic_claim_possible!==false))process.exit(1);"
            node -e "const f=require('./apex-global-intelligence-swarm/feed/crypto-discovery.json');if(f.stats.verified_deposits!==0||f.stats.confirmed_eligible!==0)process.exit(1);"
            node -e "const f=require('./apex-global-intelligence-swarm/feed/crypto-direct-leads.json');if(f.summary.verified_income_usd!==0||f.summary.automatically_claimable!==0||f.summary.received_tokens!==0)process.exit(1);"
            git add apex-global-intelligence-swarm/feed/crypto.json apex-global-intelligence-swarm/feed/crypto-discovery.json apex-global-intelligence-swarm/feed/crypto-direct-leads.json apex-global-intelligence-swarm/feed/crypto-health.json apex-global-intelligence-swarm/feed/apex-handoff.json
            if git diff --cached --quiet; then
              echo "No hubo cambios."
              exit 0
            fi
            git commit -m "data(crypto): vigilancia horaria pública [skip ci]"
            if git push origin HEAD:main; then
              echo "Radar cripto actualizado, intento $attempt."
              exit 0
            fi
            echo "::warning::Otro proceso modificó main, recuperando la última versión ($attempt/3)"
            git fetch --no-tags origin main
            git reset --hard origin/main
          done
          echo "::error::No fue posible conservar el informe tras tres intentos."
          exit 1

  private-wallet-monitor:
    name: Consulta privada de saldo ETH, solo lectura
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Obtener módulo de observación sin guardar credenciales
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar módulos y pruebas de observación de tokens
        working-directory: apex-global-intelligence-swarm
        run: |
          node --check scripts/private-wallet-observer.mjs
          node --check scripts/erc20-watch.mjs
          node --test tests/erc20-watch.test.mjs tests/private-wallet-observer.test.mjs
      - name: Consultar saldo Ethereum finalizado con configuración obligatoria
        env:
          APEX_WALLET_ADDRESS: ${{ secrets.APEX_WALLET_ADDRESS }}
        shell: bash
        run: |
          if [ -z "$APEX_WALLET_ADDRESS" ]; then
            echo "::error::La supervisión privada no está configurada. Falta APEX_WALLET_ADDRESS."
            exit 1
          fi
          node apex-global-intelligence-swarm/scripts/private-wallet-observer.mjs
      - name: Observar posibles entradas de USDC y USDT en bloques finalizados
        env:
          APEX_WALLET_ADDRESS: ${{ secrets.APEX_WALLET_ADDRESS }}
        run: node apex-global-intelligence-swarm/scripts/erc20-watch.mjs

  private-encrypted-wallet-audit:
    name: Historial privado cifrado ETH y ERC-20 (requiere secreto adicional)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Obtener código y datos ya cifrados
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar cifrado, privacidad y lectura sin custodia
        working-directory: apex-global-intelligence-swarm
        run: |
          node --check scripts/wallet-audit.mjs
          node --test tests/wallet-audit.test.mjs
      - name: Guardar historial cifrado solo si el propietario activó la clave
        shell: bash
        env:
          APEX_WALLET_ADDRESS: ${{ secrets.APEX_WALLET_ADDRESS }}
          APEX_WALLET_AUDIT_KEY: ${{ secrets.APEX_WALLET_AUDIT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APEX_WALLET_AUDIT_KEY" ]; then
            echo "::notice::Historial cifrado aún no activado. Falta crear APEX_WALLET_AUDIT_KEY en los secretos de GitHub."
            exit 0
          fi
          if [ -z "$APEX_WALLET_ADDRESS" ]; then
            echo "::error::La dirección privada no está configurada"
            exit 1
          fi
          if [[ ! "$APEX_WALLET_AUDIT_KEY" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "::error::La clave de cifrado debe ser 32 bytes aleatorios en hexadecimal; no se publicará"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node apex-global-intelligence-swarm/scripts/wallet-audit.mjs
            git add apex-global-intelligence-swarm/state/wallet-audit.enc.json
            if git diff --cached --quiet; then
              echo "Historial cifrado al día."
              exit 0
            fi
            git commit -m "data(wallet): observación privada cifrada [skip ci]"
            if git push origin HEAD:main; then
              echo "Historial privado guardado en formato autenticado; sin importes visibles."
              exit 0
            fi
            echo "::warning::Se modificó main simultáneamente; reintentando desde el último estado cifrado ($attempt/3)."
            git fetch --no-tags origin main
            git reset --hard origin/main
          done
          echo "::error::No fue posible conservar el historial cifrado tras tres intentos."
          exit 1
